<svg width="1200" height="550" viewBox="0 0 1200 550" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">ProofLayer performance evidence table</title>
  <desc id="description">A vertical table shows a 60 percent memory-poisoning attack success rate, a 52.5 percent hardened-system break rate, and a 250 percent lift from self-improvement.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.25" fill="#BFDBFE" opacity="0.5"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .pulse { animation: table-pulse 1.8s ease-in-out infinite; transform-origin: center; }
      @keyframes table-pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none; opacity: 1; } }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="548" rx="28" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="1" y="1" width="1198" height="548" rx="28" fill="url(#grid)"/>
  <circle cx="47" cy="43" r="6" fill="#2563EB"/>
  <text x="64" y="49" class="mono" fill="#1D4ED8" font-size="14" font-weight="700" letter-spacing="2">OBSERVED BREACHES · REPLAYABLE PROOF</text>

  <g filter="url(#shadow)">
    <rect x="50" y="80" width="1100" height="430" rx="22" fill="white" stroke="#93C5FD"/>
  </g>
  <circle cx="79" cy="111" r="5" fill="#2563EB"/>
  <text x="95" y="116" class="mono" fill="#1D4ED8" font-size="12" font-weight="700" letter-spacing="1.5">PERFORMANCE EVIDENCE TABLE</text>
  <text x="1122" y="116" text-anchor="end" class="sans" fill="#64748B" font-size="12">Verified on deployed multi-agent systems</text>

  <rect x="74" y="136" width="1052" height="38" rx="10" fill="#EFF6FF"/>
  <text x="94" y="160" class="mono" fill="#475569" font-size="10" font-weight="700" letter-spacing="1">SECURITY SIGNAL</text>
  <text x="510" y="160" class="mono" fill="#475569" font-size="10" font-weight="700" letter-spacing="1">RESULT</text>
  <text x="710" y="160" class="mono" fill="#475569" font-size="10" font-weight="700" letter-spacing="1">WHAT IT PROVES</text>
  <line x1="474" y1="136" x2="474" y2="444" stroke="#DBEAFE"/>
  <line x1="674" y1="136" x2="674" y2="444" stroke="#DBEAFE"/>

  <rect x="74" y="184" width="1052" height="80" rx="14" fill="#FFF7ED" stroke="#FED7AA"/>
  <circle cx="98" cy="211" r="12" fill="#FFEDD5" stroke="#F97316"/>
  <circle cx="98" cy="211" r="5" stroke="#F97316" stroke-width="2"/>
  <text x="122" y="209" class="sans" fill="#0F172A" font-size="16" font-weight="750">Memory poisoning</text>
  <text x="122" y="233" class="sans" fill="#64748B" font-size="12">Hardest agent attack class</text>
  <text x="510" y="231" class="mono" fill="#C2410C" font-size="28" font-weight="800">60%</text>
  <text x="710" y="209" class="sans" fill="#9A3412" font-size="14" font-weight="700">Attack success rate</text>
  <text x="710" y="233" class="sans" fill="#64748B" font-size="12">Validated through observable system outcomes</text>

  <rect x="74" y="274" width="1052" height="80" rx="14" fill="#FFF7ED" stroke="#FED7AA"/>
  <circle cx="98" cy="301" r="12" fill="#FFEDD5" stroke="#F97316"/>
  <path d="M91 305L96 299L100 303L106 295" stroke="#F97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="122" y="299" class="sans" fill="#0F172A" font-size="16" font-weight="750">Hardened systems</text>
  <text x="122" y="323" class="sans" fill="#64748B" font-size="12">Input filters and content guardrails enabled</text>
  <text x="500" y="321" class="mono" fill="#C2410C" font-size="27" font-weight="800">52.5%</text>
  <text x="710" y="299" class="sans" fill="#9A3412" font-size="14" font-weight="700">Observed break rate</text>
  <text x="710" y="323" class="sans" fill="#64748B" font-size="12">Measured against protected multi-agent stacks</text>

  <rect x="74" y="364" width="1052" height="80" rx="14" fill="#EFF6FF" stroke="#BFDBFE"/>
  <circle cx="98" cy="391" r="12" fill="#DBEAFE" stroke="#2563EB"/>
  <path d="M92 395L98 389L102 393L107 386" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="122" y="389" class="sans" fill="#0F172A" font-size="16" font-weight="750">Self-improvement</text>
  <text x="122" y="413" class="sans" fill="#64748B" font-size="12">Templates → trained attack experts</text>
  <text x="490" y="411" class="mono" fill="#1D4ED8" font-size="22" font-weight="800">21% → 74%</text>
  <text x="710" y="389" class="sans" fill="#1D4ED8" font-size="14" font-weight="700">+250% performance lift</text>
  <text x="710" y="413" class="sans" fill="#64748B" font-size="12">Attacks improve from successful campaign runs</text>

  <rect x="74" y="462" width="1052" height="36" rx="11" fill="#F8FAFC" stroke="#DBEAFE"/>
  <circle class="pulse" cx="96" cy="480" r="5" fill="#2563EB"/>
  <text x="112" y="485" class="mono" fill="#475569" font-size="10.5" font-weight="700">ONLY OBSERVED BREACHES COUNT AS FINDINGS</text>
  <text x="1106" y="485" text-anchor="end" class="sans" fill="#64748B" font-size="11">No model guesses</text>
</svg>
