<svg width="720" height="610" viewBox="0 0 720 610" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ProofLayer product architecture</title>
  <desc id="desc">Coding Agent Security, Automated Red Teaming, and MCP Runtime Security use one shared security plane to create one unified vulnerability report.</desc>
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#CBD5E1" fill-opacity="0.38"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="plane" x1="70" y1="266" x2="650" y2="416" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFBF5"/>
      <stop offset="1" stop-color="#FFF4E8"/>
    </linearGradient>
    <filter id="orangeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#F97316" flood-opacity="0.32"/>
    </filter>
    <style>
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-in-out infinite; }
      .delay-1 { animation-delay: -.6s; }
      .delay-2 { animation-delay: -1.2s; }
      .engine-ring { transform-box: fill-box; transform-origin: center; animation: engine-ring 2s ease-out infinite; }
      .engine-ring-delay { animation-delay: -1s; }
      .engine-core { transform-box: fill-box; transform-origin: center; animation: engine-core 1.5s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: .35; transform: scale(.72); } 50% { opacity: 1; transform: scale(1.22); } }
      @keyframes engine-ring { 0% { opacity: .8; transform: scale(.7); } 80%, 100% { opacity: 0; transform: scale(1.25); } }
      @keyframes engine-core { 0%, 100% { transform: scale(.9); opacity: .8; } 50% { transform: scale(1.15); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .pulse, .engine-ring, .engine-core { animation: none; } }
    </style>
  </defs>

  <rect width="720" height="610" rx="24" fill="#F8FAFC"/>
  <rect width="720" height="610" rx="24" fill="url(#grid)"/>

  <!-- Product surfaces -->
  <g filter="url(#shadow)">
    <rect x="26" y="38" width="210" height="166" rx="17" fill="white" stroke="#94A3B8" stroke-dasharray="6 5"/>
    <rect x="255" y="38" width="210" height="166" rx="17" fill="white" stroke="#DBEAFE"/>
    <rect x="484" y="38" width="210" height="166" rx="17" fill="white" stroke="#DBEAFE"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="800">
    <rect x="44" y="56" width="54" height="22" rx="11" fill="#F1F5F9"/><circle cx="56" cy="67" r="3" fill="#64748B"/><text x="65" y="70" fill="#475569">BUILD</text>
    <rect x="273" y="56" width="58" height="22" rx="11" fill="#EFF6FF"/><circle cx="285" cy="67" r="3" fill="#2563EB"/><text x="294" y="70" fill="#1D4ED8">BATCH</text>
    <rect x="502" y="56" width="50" height="22" rx="11" fill="#EFF6FF"/><circle cx="514" cy="67" r="3" fill="#2563EB"/><text x="523" y="70" fill="#1D4ED8">LIVE</text>
  </g>

  <!-- Small, consistent product icons -->
  <g>
    <rect x="44" y="94" width="46" height="46" rx="13" fill="#EFF6FF" stroke="#DBEAFE"/>
    <g stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="54" y="105" width="26" height="19" rx="3"/><path d="M50 129h34l-4 5H54l-4-5ZM62 112l-4 3 4 3M72 112l4 3-4 3"/>
    </g>
    <rect x="273" y="94" width="46" height="46" rx="13" fill="#EFF6FF" stroke="#DBEAFE"/>
    <g stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="296" cy="117" r="11"/><circle cx="296" cy="117" r="4"/><path d="M296 101v7M296 126v7M280 117h7M305 117h7"/>
    </g>
    <rect x="502" y="94" width="46" height="46" rx="13" fill="#EFF6FF" stroke="#DBEAFE"/>
    <path d="M525 103l13 5v10c0 9-5 15-13 19-8-4-13-10-13-19v-10l13-5Z" stroke="#2563EB" stroke-width="1.6"/>
    <path d="m519 119 5 5 8-10" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="#334155" font-family="Inter, ui-sans-serif, sans-serif">
    <text x="102" y="106" font-size="13.5" font-weight="800">Coding Agent</text>
    <text x="102" y="123" font-size="13.5" font-weight="800">Security</text>
    <text x="102" y="143" font-size="10.5" fill="#64748B">Local and air-gapped</text>
    <text x="331" y="106" font-size="13.5" font-weight="800">Automated</text>
    <text x="331" y="123" font-size="13.5" font-weight="800">Red Teaming</text>
    <text x="331" y="143" font-size="10.5" fill="#64748B">Scheduled nightly</text>
    <text x="560" y="106" font-size="13.5" font-weight="800">MCP Runtime</text>
    <text x="560" y="123" font-size="13.5" font-weight="800">Security</text>
    <text x="560" y="143" font-size="10.5" fill="#64748B">Inline with live traffic</text>
  </g>
  <g fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="700">
    <text x="44" y="179">OPEN SOURCE</text>
    <text x="273" y="179">AUTONOMOUS ATTACKS</text>
    <text x="502" y="179">REAL-TIME PROTECTION</text>
  </g>

  <!-- Inputs into the security plane -->
  <path d="M131 204v62" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 5"/>
  <path d="M360 204v62M589 204v62" stroke="#2563EB" stroke-width="1.5"/>
  <circle class="pulse" cx="131" cy="242" r="4" fill="#64748B" stroke="white" stroke-width="2"/>
  <circle class="pulse delay-1" cx="360" cy="242" r="4" fill="#DC2626" stroke="white" stroke-width="2"/>
  <circle class="pulse delay-2" cx="589" cy="242" r="4" fill="#DC2626" stroke="white" stroke-width="2"/>
  <text x="142" y="243" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="700">AIR-GAPPED EXPORT</text>

  <!-- Dominant shared plane -->
  <g filter="url(#shadow)">
    <rect x="70" y="266" width="580" height="150" rx="21" fill="url(#plane)" stroke="#FDBA74"/>
  </g>
  <path d="M131 266v20h176c17 0 30 7 39 19M360 266v36M589 266v20H413c-17 0-30 7-39 19" stroke="#FDBA74" stroke-width="1.5" stroke-linecap="round"/>
  <circle class="pulse" cx="307" cy="286" r="4" fill="#F97316" stroke="white" stroke-width="2"/>
  <circle class="pulse delay-1" cx="360" cy="286" r="4" fill="#F97316" stroke="white" stroke-width="2"/>
  <circle class="pulse delay-2" cx="413" cy="286" r="4" fill="#F97316" stroke="white" stroke-width="2"/>
  <g filter="url(#orangeGlow)">
    <circle class="engine-ring" cx="360" cy="337" r="36" fill="none" stroke="#FB923C" stroke-width="2"/>
    <circle class="engine-ring engine-ring-delay" cx="360" cy="337" r="29" fill="none" stroke="#FDBA74" stroke-width="2"/>
    <circle cx="360" cy="337" r="25" fill="white" stroke="#F97316" stroke-width="2"/>
    <circle cx="360" cy="337" r="13" fill="#FFF7ED" stroke="#FB923C" stroke-width="2"/>
    <circle class="engine-core" cx="360" cy="337" r="6" fill="#F97316"/>
  </g>
  <g stroke="#F97316" stroke-width="2" stroke-linecap="round">
    <path d="M360 300v8M360 366v8M323 337h8M389 337h8"/>
  </g>
  <rect x="292" y="382" width="136" height="24" rx="12" fill="white" stroke="#FED7AA"/>
  <circle class="engine-core" cx="308" cy="394" r="3.5" fill="#F97316"/>
  <text x="319" y="398" fill="#9A3412" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="800" letter-spacing=".8">DETECTION ENGINE</text>

  <!-- Unified output -->
  <path d="M360 416v57" stroke="#2563EB" stroke-width="1.7"/>
  <circle class="pulse delay-1" cx="360" cy="444" r="5" fill="#2563EB" stroke="white" stroke-width="2.5"/>
  <path d="m355 467 5 6 5-6" stroke="#2563EB" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)">
    <rect x="100" y="473" width="520" height="119" rx="19" fill="white" stroke="#93C5FD"/>
  </g>
  <circle cx="126" cy="503" r="4" fill="#2563EB"/>
  <text x="138" y="508" fill="#1D4ED8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="800" letter-spacing="1.2">ONE VULNERABILITY REPORT</text>
  <text x="126" y="532" fill="#334155" font-family="Inter, ui-sans-serif, sans-serif" font-size="14" font-weight="800">Prioritized risk and audit-ready evidence.</text>
  <g fill="#F8FAFC" stroke="#E2E8F0">
    <rect x="126" y="550" width="78" height="25" rx="8"/><rect x="212" y="550" width="88" height="25" rx="8"/><rect x="308" y="550" width="72" height="25" rx="8"/><rect x="388" y="550" width="142" height="25" rx="8"/>
  </g>
  <g fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="800" text-anchor="middle">
    <text x="165" y="566">EXPLOIT</text><text x="256" y="566">SEVERITY</text><text x="344" y="566">OWNER</text><text x="459" y="566">AUDIT EVIDENCE</text>
  </g>
</svg>
