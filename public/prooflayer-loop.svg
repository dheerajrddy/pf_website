<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">ProofLayer continuous security evidence loop</title>
  <desc id="description">Autonomous attacks flow into verified findings and replay, then into audit-ready evidence. The loop repeats after every release.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.25" fill="#BFDBFE" opacity="0.55"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1L6 4L1 7" stroke="#DC2626" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1L6 4L1 7" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .pulse-red { animation: pulse-red 1.8s ease-in-out infinite; transform-origin: center; }
      .pulse-blue { animation: pulse-blue 1.8s ease-in-out infinite .35s; transform-origin: center; }
      .flow-red, .flow-blue { fill: none; stroke-linecap: round; stroke-dasharray: 3 10; animation: line-flow 1.05s linear infinite; }
      .flow-blue { animation-duration: 1.2s; }
      .flow-loop { animation-duration: 2.6s; stroke-dasharray: 4 13; }
      @keyframes pulse-red { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes pulse-blue { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
      @keyframes line-flow { to { stroke-dashoffset: -26; } }
      @media (prefers-reduced-motion: reduce) {
        .pulse-red, .pulse-blue { animation: none; opacity: 1; }
        .flow-red, .flow-blue { display: none; }
      }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="498" rx="28" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="1" y="1" width="1198" height="498" rx="28" fill="url(#grid)"/>

  <circle cx="47" cy="43" r="6" fill="#2563EB"/>
  <text x="64" y="49" class="mono" fill="#1D4ED8" font-size="14" font-weight="700" letter-spacing="2">CONTINUOUS PROOF LOOP</text>
  <text x="1152" y="49" text-anchor="end" class="mono" fill="#64748B" font-size="12" font-weight="600" letter-spacing="1.5">ATTACK  →  DETECT  →  PROVE</text>

  <g filter="url(#shadow)">
    <rect x="50" y="82" width="315" height="252" rx="20" fill="white" stroke="#FCA5A5"/>
    <rect x="443" y="82" width="315" height="252" rx="20" fill="#FFF7ED" stroke="#FDBA74"/>
    <rect x="835" y="82" width="315" height="252" rx="20" fill="white" stroke="#93C5FD"/>
  </g>

  <!-- Attack -->
  <rect x="76" y="106" width="104" height="28" rx="14" fill="#FEF2F2" stroke="#FECACA"/>
  <circle cx="91" cy="120" r="4" fill="#DC2626"/>
  <text x="104" y="124" class="mono" fill="#B91C1C" font-size="11" font-weight="700" letter-spacing="1.2">01 ATTACK</text>
  <g transform="translate(78 156)" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round">
    <circle cx="22" cy="22" r="13"/>
    <circle cx="22" cy="22" r="5"/>
    <path d="M22 0V7M22 37V44M0 22H7M37 22H44"/>
  </g>
  <text x="138" y="177" class="sans" fill="#0F172A" font-size="20" font-weight="750">Autonomous attacks</text>
  <text x="77" y="222" class="sans" fill="#475569" font-size="15">Test every deployed AI system.</text>
  <rect x="76" y="252" width="73" height="34" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="157" y="252" width="78" height="34" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="243" y="252" width="91" height="34" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="112.5" y="274" text-anchor="middle" class="mono" fill="#475569" font-size="11" font-weight="700">LLMS</text>
  <text x="196" y="274" text-anchor="middle" class="mono" fill="#475569" font-size="11" font-weight="700">AGENTS</text>
  <text x="288.5" y="274" text-anchor="middle" class="mono" fill="#475569" font-size="11" font-weight="700">MCP</text>
  <text x="77" y="315" class="mono" fill="#64748B" font-size="11" font-weight="600">PROMPT INJECTION · TOOL ABUSE · RAG</text>

  <!-- Detect -->
  <rect x="469" y="106" width="106" height="28" rx="14" fill="#FFEDD5" stroke="#FDBA74"/>
  <circle cx="484" cy="120" r="4" fill="#F97316"/>
  <text x="497" y="124" class="mono" fill="#C2410C" font-size="11" font-weight="700" letter-spacing="1.2">02 DETECT</text>
  <g transform="translate(471 154)" stroke="#F97316" stroke-width="2.2" stroke-linecap="round">
    <circle cx="23" cy="23" r="16"/>
    <circle cx="23" cy="23" r="7"/>
    <path d="M23 0V5M23 41V46M0 23H5M41 23H46"/>
  </g>
  <circle class="pulse-red" cx="494" cy="177" r="20" stroke="#F97316" stroke-width="1.5" opacity="0.35"/>
  <text x="531" y="177" class="sans" fill="#0F172A" font-size="20" font-weight="750">Verified findings</text>
  <text x="470" y="222" class="sans" fill="#475569" font-size="15">Replay every breach with its exact trace.</text>
  <rect x="469" y="252" width="80" height="34" rx="9" fill="white" stroke="#FED7AA"/>
  <rect x="557" y="252" width="87" height="34" rx="9" fill="white" stroke="#FED7AA"/>
  <rect x="652" y="252" width="77" height="34" rx="9" fill="white" stroke="#FED7AA"/>
  <text x="509" y="274" text-anchor="middle" class="mono" fill="#475569" font-size="10.5" font-weight="700">EXPLOIT</text>
  <text x="600.5" y="274" text-anchor="middle" class="mono" fill="#475569" font-size="10.5" font-weight="700">SEVERITY</text>
  <text x="690.5" y="274" text-anchor="middle" class="mono" fill="#475569" font-size="10.5" font-weight="700">TRACE</text>
  <text x="470" y="315" class="mono" fill="#64748B" font-size="11" font-weight="600">ZERO FALSE-POSITIVE GRINDING</text>

  <!-- Prove -->
  <rect x="861" y="106" width="101" height="28" rx="14" fill="#EFF6FF" stroke="#BFDBFE"/>
  <circle cx="876" cy="120" r="4" fill="#2563EB"/>
  <text x="889" y="124" class="mono" fill="#1D4ED8" font-size="11" font-weight="700" letter-spacing="1.2">03 PROVE</text>
  <g transform="translate(864 155)" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 2H30L41 13V43H7Z"/>
    <path d="M30 2V14H41M15 28L21 34L33 21"/>
  </g>
  <text x="921" y="177" class="sans" fill="#0F172A" font-size="20" font-weight="750">Audit-ready evidence</text>
  <text x="862" y="222" class="sans" fill="#475569" font-size="15">Board and auditor packets.</text>
  <rect x="861" y="252" width="59" height="34" rx="9" fill="#F8FAFC" stroke="#DBEAFE"/>
  <rect x="928" y="252" width="73" height="34" rx="9" fill="#F8FAFC" stroke="#DBEAFE"/>
  <rect x="1009" y="252" width="76" height="34" rx="9" fill="#F8FAFC" stroke="#DBEAFE"/>
  <rect x="1093" y="252" width="42" height="34" rx="9" fill="#F8FAFC" stroke="#DBEAFE"/>
  <text x="890.5" y="274" text-anchor="middle" class="mono" fill="#475569" font-size="10" font-weight="700">SOC 2</text>
  <text x="964.5" y="274" text-anchor="middle" class="mono" fill="#475569" font-size="9" font-weight="700">NIST AI</text>
  <text x="1047" y="274" text-anchor="middle" class="mono" fill="#475569" font-size="9.5" font-weight="700">EU AI ACT</text>
  <text x="1114" y="274" text-anchor="middle" class="mono" fill="#475569" font-size="9.5" font-weight="700">ISO</text>
  <text x="862" y="315" class="mono" fill="#64748B" font-size="11" font-weight="600">CONTROL MAPPINGS · BOARD SUMMARY</text>

  <!-- Forward flow -->
  <path d="M365 208H428" stroke="#DC2626" stroke-width="2" opacity="0.28" marker-end="url(#arrow-red)"/>
  <path class="flow-red" d="M365 208H428" stroke="#DC2626" stroke-width="3"/>
  <circle class="pulse-red" cx="396" cy="208" r="5" fill="#DC2626" stroke="white" stroke-width="2"/>
  <rect x="370" y="181" width="52" height="20" rx="10" fill="#FFF7F7"/>
  <text x="396" y="195" text-anchor="middle" class="mono" fill="#B91C1C" font-size="9" font-weight="700">BREACH</text>
  <path d="M758 208H820" stroke="#2563EB" stroke-width="2" opacity="0.28" marker-end="url(#arrow-blue)"/>
  <path class="flow-blue" d="M758 208H820" stroke="#2563EB" stroke-width="3"/>
  <circle class="pulse-blue" cx="789" cy="208" r="5" fill="#2563EB" stroke="white" stroke-width="2"/>
  <rect x="761" y="181" width="56" height="20" rx="10" fill="#F4F8FF"/>
  <text x="789" y="195" text-anchor="middle" class="mono" fill="#1D4ED8" font-size="9" font-weight="700">EVIDENCE</text>

  <!-- Continuous return path -->
  <path d="M993 334V382C993 394 983 404 971 404H236C224 404 214 394 214 382V350" stroke="#2563EB" stroke-width="2" stroke-linecap="round" opacity="0.3" marker-end="url(#arrow-blue)"/>
  <path class="flow-blue flow-loop" d="M993 334V382C993 394 983 404 971 404H236C224 404 214 394 214 382V350" stroke="#2563EB" stroke-width="3"/>
  <circle class="pulse-blue" cx="604" cy="404" r="5" fill="#2563EB" stroke="white" stroke-width="2"/>
  <rect x="474" y="386" width="260" height="36" rx="18" fill="white" stroke="#BFDBFE"/>
  <circle cx="493" cy="404" r="4" fill="#2563EB"/>
  <text x="509" y="409" class="mono" fill="#1D4ED8" font-size="11" font-weight="700" letter-spacing="1">REPEAT AFTER EVERY RELEASE</text>

  <text x="600" y="463" text-anchor="middle" class="sans" fill="#475569" font-size="15" font-weight="600">Current adversarial evidence for boards and auditors</text>
</svg>
