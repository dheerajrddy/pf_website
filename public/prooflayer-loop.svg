<svg width="1200" height="640" viewBox="0 0 1200 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">ProofLayer circular security evidence loop</title>
  <desc id="description">Three compact nodes centered on a circular path show autonomous attacks, verified findings, and audit-ready evidence.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.25" fill="#BFDBFE" opacity="0.46"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.055"/>
    </filter>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1L6 4L1 7" stroke="#DC2626" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1L6 4L1 7" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .flow-red, .flow-blue { fill: none; stroke-linecap: round; stroke-dasharray: 4 12; animation: circle-flow 1.35s linear infinite; }
      .flow-blue { animation-duration: 1.7s; }
      .pulse { animation: circle-pulse 1.8s ease-in-out infinite; transform-origin: center; }
      @keyframes circle-flow { to { stroke-dashoffset: -32; } }
      @keyframes circle-pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .flow-red, .flow-blue { display: none; } .pulse { animation: none; opacity: 1; } }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="638" rx="28" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="1" y="1" width="1198" height="638" rx="28" fill="url(#grid)"/>
  <circle cx="47" cy="43" r="6" fill="#2563EB"/>
  <text x="64" y="49" class="mono" fill="#1D4ED8" font-size="14" font-weight="700" letter-spacing="2">CONTINUOUS PROOF LOOP</text>
  <text x="1152" y="49" text-anchor="end" class="mono" fill="#64748B" font-size="12" font-weight="600" letter-spacing="1.5">ATTACK  →  DETECT  →  PROVE  →</text>

  <!-- Geometrically true circle, centered at 600 × 345 -->
  <circle cx="600" cy="345" r="225" stroke="#CBD5E1" stroke-width="2" opacity="0.42"/>
  <path d="M600 120A225 225 0 0 1 794.9 457.5" stroke="#DC2626" stroke-width="2" opacity="0.22" marker-end="url(#arrow-red)"/>
  <path class="flow-red" d="M600 120A225 225 0 0 1 794.9 457.5" stroke="#DC2626" stroke-width="3"/>
  <path d="M794.9 457.5A225 225 0 0 1 405.1 457.5" stroke="#2563EB" stroke-width="2" opacity="0.22" marker-end="url(#arrow-blue)"/>
  <path class="flow-blue" d="M794.9 457.5A225 225 0 0 1 405.1 457.5" stroke="#2563EB" stroke-width="3"/>
  <path d="M405.1 457.5A225 225 0 0 1 600 120" stroke="#2563EB" stroke-width="2" opacity="0.22" marker-end="url(#arrow-blue)"/>
  <path class="flow-blue" d="M405.1 457.5A225 225 0 0 1 600 120" stroke="#2563EB" stroke-width="3"/>

  <circle class="pulse" cx="775" cy="203" r="4.5" fill="#DC2626" stroke="white" stroke-width="2"/>
  <rect x="746" y="170" width="58" height="22" rx="11" fill="white" stroke="#FECACA"/>
  <text x="775" y="185" text-anchor="middle" class="mono" fill="#B91C1C" font-size="9" font-weight="700">BREACH</text>
  <circle class="pulse" cx="600" cy="570" r="4.5" fill="#2563EB" stroke="white" stroke-width="2"/>
  <rect x="563" y="553" width="74" height="26" rx="13" fill="white" stroke="#BFDBFE"/>
  <text x="600" y="570" text-anchor="middle" class="mono" fill="#1D4ED8" font-size="9" font-weight="700">EVIDENCE</text>
  <circle class="pulse" cx="425" cy="203" r="4.5" fill="#2563EB" stroke="white" stroke-width="2"/>
  <rect x="393" y="170" width="64" height="22" rx="11" fill="white" stroke="#BFDBFE"/>
  <text x="425" y="185" text-anchor="middle" class="mono" fill="#1D4ED8" font-size="9" font-weight="700">RELEASE</text>

  <circle cx="600" cy="326" r="4.5" fill="#2563EB"/>
  <text x="600" y="356" text-anchor="middle" class="mono" fill="#1D4ED8" font-size="10.5" font-weight="700" letter-spacing="1.4">REPEAT AFTER EVERY RELEASE</text>
  <text x="600" y="382" text-anchor="middle" class="sans" fill="#475569" font-size="12.5">Adversarial evidence stays current</text>

  <!-- Compact nodes centered on the circular path -->
  <g filter="url(#shadow)">
    <rect x="480" y="70" width="240" height="100" rx="16" fill="white" stroke="#FCA5A5"/>
    <rect x="675" y="407.5" width="240" height="100" rx="16" fill="#FFF7ED" stroke="#FDBA74"/>
    <rect x="285" y="407.5" width="240" height="100" rx="16" fill="white" stroke="#93C5FD"/>
  </g>

  <!-- Attack: centered at 600 × 120 -->
  <circle cx="502" cy="93" r="3.5" fill="#DC2626"/>
  <text x="514" y="97" class="mono" fill="#B91C1C" font-size="9.5" font-weight="700" letter-spacing="1">01 ATTACK</text>
  <text x="502" y="126" class="sans" fill="#0F172A" font-size="17" font-weight="750">Autonomous attacks</text>
  <text x="502" y="151" class="sans" fill="#475569" font-size="12.5">LLMs · agents · MCP servers</text>

  <!-- Detect: centered at 794.9 × 457.5 -->
  <circle cx="697" cy="430.5" r="3.5" fill="#F97316"/>
  <text x="709" y="434.5" class="mono" fill="#C2410C" font-size="9.5" font-weight="700" letter-spacing="1">02 DETECT</text>
  <text x="697" y="463.5" class="sans" fill="#0F172A" font-size="17" font-weight="750">Verified findings</text>
  <text x="697" y="488.5" class="sans" fill="#475569" font-size="12.5">Exploit · severity · replay trace</text>

  <!-- Prove: centered at 405.1 × 457.5 -->
  <circle cx="307" cy="430.5" r="3.5" fill="#2563EB"/>
  <text x="319" y="434.5" class="mono" fill="#1D4ED8" font-size="9.5" font-weight="700" letter-spacing="1">03 PROVE</text>
  <text x="307" y="463.5" class="sans" fill="#0F172A" font-size="17" font-weight="750">Audit-ready evidence</text>
  <text x="307" y="488.5" class="sans" fill="#475569" font-size="12.5">SOC 2 · NIST · EU AI Act · ISO</text>
</svg>
